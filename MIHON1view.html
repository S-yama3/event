<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見本市実績集計ダッシュボード</title>

<style>
    body {
        font-family: "Segoe UI", Meiryo, sans-serif;
        margin: 10px;
        background: #f8f9fa;
        color: #333;
    }

    h2 {
        border-left: 5px solid #2c3e50;
        padding-left: 10px;
        margin-bottom: 15px;
        font-size: 18px;
    }

    .table-container {
        overflow-x: auto;
        background: white;
        border: 1px solid #999;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        margin-bottom: 15px;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        text-align: left;
    }

    th, td {
        border: 1px solid #a6a6a6;
        padding: 4px 6px;
        white-space: nowrap;
    }

    thead th {
        background: #f2f2f2;
        text-align: center;
        font-weight: normal;
    }

    /* 列指定 */
    .col-code { font-family: monospace; width: 80px; }
    .col-name { width: 130px; }
    .col-num { text-align: right; width: 90px; }

    /* スプレッドシート再現カラーリング */
    .bg-yellow { background-color: #ffffcc; }
    .bg-light-yellow { background-color: #ffffeb; }
    .bg-blue { background-color: #ddebf7; }
    .bg-orange { background-color: #fce4d6; }
    .bg-pink-total { background-color: #f8cecc; }

    .font-bold { font-weight: bold; }

    /* ========================================
       スマホ表示用メディアクエリ (幅 768px 以下)
       ================================-------- */
    @media screen and (max-width: 768px) {
        body {
            margin: 5px;
        }
        h2 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        table {
            font-size: 11px;
        }
        th, td {
            padding: 3px 4px;
        }
        /* アカウントID列を非表示にする */
        .col-code, th:nth-child(1), td:nth-child(1) {
            display: none;
        }
        .col-name {
            width: 110px;
        }
        .col-num {
            width: 75px;
        }
    }

    /* 開発者用・デバッグ用折りたたみスタイル */
    details {
        margin-top: 15px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px 12px;
    }

    summary {
        font-weight: bold;
        cursor: pointer;
        padding: 4px 0;
        font-size: 14px;
    }

    .status-box {
        background: #f8f9fa;
        border: 1px solid #ddd;
        padding: 10px;
        margin-top: 10px;
        border-radius: 4px;
    }

    #status {
        font-weight: bold;
        font-size: 14px;
    }

    .success { color: #198754 !important; }
    .error { color: #dc3545 !important; }
    .waiting { color: #0d6efd !important; }

    #log {
        background: #222;
        color: #eee;
        padding: 10px;
        height: 120px;
        overflow-y: auto;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-radius: 4px;
        margin-top: 8px;
    }

    pre {
        background: #f4f4f4;
        border: 1px solid #ccc;
        padding: 8px;
        overflow: auto;
        font-size: 11px;
        max-height: 200px;
    }

    button {
        padding: 6px 14px;
        cursor: pointer;
        border: 1px solid #999;
        background: #fff;
        border-radius: 4px;
        font-size: 13px;
    }
    button:hover { background: #eee; }
</style>
</head>

<body>

<h2>見本市実績集計ダッシュボード</h2>

<!-- 実績集計結果テーブル -->
<div class="table-container">
<table>
<thead>
<tr>
    <th>アカウントID</th>
    <th>氏名 / 区分</th>
    <th>目標</th>
    <th>実績</th>
    <th>達成率</th>
    <th>前期実績</th>
    <th>前期比</th>
</tr>
</thead>
<tbody id="tableBody">
<tr>
    <td colspan="7" style="text-align:center;">データを読み込み中...</td>
</tr>
</tbody>
</table>
</div>

<!-- 下部に折りたたんだ接続テスト・ログ・JSON確認領域 -->
<details>
    <summary>⚙️ GAS接続テスト・通信ログ・JSONデータ確認</summary>
    
    <div class="status-box">
        <div>GAS接続状態：<span id="status" class="waiting">接続準備中...</span></div>
        <p id="detail" style="margin: 5px 0 10px 0; font-size:12px;">データを確認しています。</p>
        <button onclick="loadReport()">再接続</button>
    </div>

    <h4 style="font-size:13px; margin:10px 0 5px 0;">通信ログ</h4>
    <div id="log"></div>

    <h4 style="font-size:13px; margin:10px 0 5px 0;">受信データ (JSON)</h4>
    <pre id="rawData">未受信</pre>
</details>

<script>
// ========================================
// GAS設定
// ========================================
const webAppUrl = "https://script.google.com/macros/s/AKfycby7MNM-OxQoX4lo-1MAkksIl8vUJ2lKJJhQRpwptY1p30048spAeYjgl5EPI3FVEGCD/exec";

let currentScript = null;
let timeoutTimer = null;
let requestId = 0;

// ========================================
// 表示データ構造
// ========================================
const rowsConfig = [
    // --- 店舗 ---
    { type: 'data', id: 'ecl00750', name: '安井 秀幸', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl02695', name: '武藤 茉奈美', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl03317', name: '伊藤 彩香', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl04354', name: '文 赤井沢 ２', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl07853', name: '仙台文紙 ２', bg: 'bg-light-yellow' },
    { type: 'sum',  name: '店舗小計', targets: ['ecl00750','ecl02695','ecl03317','ecl04354','ecl07853'], bg: 'bg-yellow' },

    // --- RS (納品) ---
    { type: 'data', id: 'ecl04350', name: '佐川 規人', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl02088', name: '中川 雅之', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl00747', name: '郡山 敏明', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl04351', name: '黒澤 健', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl04352', name: '相模 史信', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl04621', name: '文 赤井沢', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl07851', name: '仙台文紙', bg: 'bg-light-yellow' },
    { type: 'sum',  name: '納品小計', idKey: 'nouhin_sub', targets: ['ecl04350','ecl02088','ecl00747','ecl04351','ecl04352','ecl04621','ecl07851'], bg: 'bg-yellow' },
    { type: 'sumKeys', name: 'ＲＳ仙台小計', idKey: 'rs_sendai', targetKeys: ['nouhin_sub', '店舗小計'], bg: 'bg-yellow' },

    // --- OS 仙台 ---
    { type: 'data', id: 'ecl02239', name: '浅野 勝寿', bg: 'bg-blue' },
    { type: 'data', id: 'ecl02439', name: '内野 正太郎', bg: 'bg-blue' },
    { type: 'data', id: 'ecl02777', name: '中島 祐太', bg: 'bg-blue' },
    { type: 'data', id: 'ecl04622', name: '事 赤井沢', bg: 'bg-blue' },
    { type: 'data', id: 'ecl07821', name: '仙台事務機', bg: 'bg-blue' },
    { type: 'sum',  name: 'ＯＳ仙台小計', idKey: 'os_sendai', targets: ['ecl02239','ecl02439','ecl02777','ecl04622','ecl07821'], bg: 'bg-blue' },

    // 仙台小計
    { type: 'sumKeys', name: '仙台小計', idKey: 'sendai_total', targetKeys: ['os_sendai', 'rs_sendai'], bg: 'bg-orange' },

    // --- RS 郡山 ---
    { type: 'data', id: 'ecl00749', name: '高橋 伸一', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl00779', name: '河村 康成', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl01160', name: '橋本 勉', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl02644', name: '猪狩 翔太', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl04625', name: '文 シーエス', bg: 'bg-light-yellow' },
    { type: 'data', id: 'ecl07861', name: '郡山文紙', bg: 'bg-light-yellow' },
    { type: 'sum',  name: 'ＲＳ郡山小計', idKey: 'rs_koriyama', targets: ['ecl00749','ecl00779','ecl01160','ecl02644','ecl04625','ecl07861'], bg: 'bg-yellow' },

    // --- OS 郡山 ---
    { type: 'data', id: 'ecl00807', name: '樽川 昌幸', bg: 'bg-blue' },
    { type: 'data', id: 'ecl04627', name: '事 シーエス', bg: 'bg-blue' },
    { type: 'data', id: 'ecl04649', name: 'いわき他', bg: 'bg-blue' },
    { type: 'data', id: 'ecl07841', name: '郡山事務機', bg: 'bg-blue' },
    { type: 'sum',  name: 'ＯＳ郡山小計', idKey: 'os_koriyama', targets: ['ecl00807','ecl04627','ecl04649','ecl07841'], bg: 'bg-blue' },

    // 郡山小計
    { type: 'sumKeys', name: '郡山小計', idKey: 'koriyama_total', targetKeys: ['os_koriyama', 'rs_koriyama'], bg: 'bg-orange' },

    // --- OS 岩手 ---
    { type: 'data', id: 'ecl00814', name: '高橋 伸', bg: 'bg-blue' },
    { type: 'data', id: 'ecl02446', name: '菅原 修二', bg: 'bg-blue' },
    { type: 'sum',  name: 'ＯＳ岩手小計', idKey: 'os_iwate', targets: ['ecl00814','ecl02446'], bg: 'bg-blue' },

    // --- 総合計区分 ---
    { type: 'sumKeys', name: 'ＲＳ小計', idKey: 'rs_total', targetKeys: ['rs_koriyama', 'rs_sendai'], bg: 'bg-yellow' },
    { type: 'sumKeys', name: 'ＯＳ小計', idKey: 'os_total', targetKeys: ['os_sendai', 'os_koriyama', 'os_iwate'], bg: 'bg-blue' },
    { type: 'sumKeys', name: '全社合計', idKey: 'all_total', targetKeys: ['rs_total', 'os_total'], bg: 'bg-pink-total' }
];

function writeLog(message) {
    const log = document.getElementById("log");
    const time = new Date().toLocaleTimeString();
    log.textContent += "[" + time + "] " + message + "\n";
    log.scrollTop = log.scrollHeight;
    console.log(message);
}

function setStatus(message, type, detail) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.className = type;
    document.getElementById("detail").textContent = detail || "";
}

// スマホ判定：画面幅が768px以下の場合に千円単位（1000で割る）にする判定
function isMobile() {
    return window.innerWidth <= 768;
}

// 数値フォーマット（スマホ時は千円単位に変換してカンマ区切り）
function formatNum(val) {
    if (val === null || val === undefined || isNaN(val)) return "-";
    let num = Number(val);
    if (isMobile()) {
        num = Math.round(num / 1000); // 千円単位に丸める
    }
    return num.toLocaleString();
}

function calcRate(actual, base) {
    if (!base || base === 0 || actual === null || actual === undefined) return "-";
    return ((actual / base) * 100).toFixed(2) + "%";
}

window.handleReportData = function(apiData) {
    writeLog("① JSONPコールバック実行");

    try {
        if (!apiData || typeof apiData !== "object") {
            throw new Error("受信データがJSONオブジェクトではありません");
        }

        writeLog("② GASデータ受信成功");
        document.getElementById("rawData").textContent = JSON.stringify(apiData, null, 2);

        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        const calcMap = {};

        Object.keys(apiData).forEach(id => {
            const item = apiData[id];
            calcMap[id] = {
                target: Number(item.target) || 0,
                actual: Number(item.actual) || 0,
                prevActual: Number(item.prevActual) || 0
            };
        });

        rowsConfig.forEach(config => {
            let idText = "";
            let nameText = config.name;
            let target = 0, actual = 0, prevActual = 0;

            if (config.type === 'data') {
                idText = config.id;
                const d = calcMap[config.id] || { target: 0, actual: 0, prevActual: 0 };
                target = d.target;
                actual = d.actual;
                prevActual = d.prevActual;
            } 
            else if (config.type === 'sum') {
                config.targets.forEach(tid => {
                    const d = calcMap[tid] || { target: 0, actual: 0, prevActual: 0 };
                    target += d.target;
                    actual += d.actual;
                    prevActual += d.prevActual;
                });
                const key = config.idKey || config.name;
                calcMap[key] = { target, actual, prevActual };
            } 
            else if (config.type === 'sumKeys') {
                config.targetKeys.forEach(tKey => {
                    const d = calcMap[tKey] || { target: 0, actual: 0, prevActual: 0 };
                    target += d.target;
                    actual += d.actual;
                    prevActual += d.prevActual;
                });
                if (config.idKey) {
                    calcMap[config.idKey] = { target, actual, prevActual };
                }
            }

            const tr = document.createElement("tr");
            if (config.bg) tr.className = config.bg;
            if (config.type !== 'data') tr.classList.add("font-bold");

            const values = [
                idText,
                nameText,
                formatNum(target),
                formatNum(actual),
                calcRate(actual, target),
                formatNum(prevActual),
                calcRate(actual, prevActual)
            ];

            values.forEach((val, idx) => {
                const td = document.createElement("td");
                td.textContent = val;

                if (idx === 0) td.className = "col-code";
                else if (idx === 1) td.className = "col-name";
                else if (idx >= 2) td.className = "col-num";

                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });

        writeLog("③ 集計表の作成完了");
        setStatus("接続成功・データ取得完了", "success", "データを正常に表示しました。");
        clearTimeout(timeoutTimer);

    } catch (error) {
        writeLog("受信処理エラー：" + error.message);
        setStatus("データ処理エラー", "error", error.message);
        showError();
    }
};

function showError() {
    document.getElementById("tableBody").innerHTML =
        '<tr><td colspan="7" style="color:red;text-align:center;">データの取得・集計に失敗しました。</td></tr>';
}

function loadReport() {
    clearTimeout(timeoutTimer);
    if (currentScript) {
        currentScript.remove();
        currentScript = null;
    }
    requestId++;
    const thisRequest = requestId;

    document.getElementById("log").textContent = "";
    document.getElementById("rawData").textContent = "未受信";
    document.getElementById("tableBody").innerHTML =
        '<tr><td colspan="7" style="text-align:center;">データを読み込み中...</td></tr>';

    setStatus("GAS接続中...", "waiting", "Google Apps Scriptに接続しています。");
    writeLog("GAS接続開始");

    const script = document.createElement("script");
    currentScript = script;
    script.async = true;
    script.src = webAppUrl + "?callback=handleReportData&t=" + Date.now();

    script.onerror = function() {
        if (thisRequest !== requestId) return;
        clearTimeout(timeoutTimer);
        writeLog("通信エラー：script.onerror");
        setStatus("GAS通信エラー", "error", "GASからJavaScriptを読み込めませんでした。");
        showError();
    };

    document.body.appendChild(script);

    timeoutTimer = setTimeout(function() {
        if (thisRequest !== requestId) return;
        if (document.getElementById("status").textContent === "GAS接続中...") {
            writeLog("タイムアウト：15秒以内に応答がありません");
            setStatus("タイムアウト", "error", "GASからの応答がありませんでした。");
            showError();
        }
    }, 15000);
}

window.addEventListener("DOMContentLoaded", function() {
    loadReport();
});
</script>

</body>
</html>
