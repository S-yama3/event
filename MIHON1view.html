<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実績集計ダッシュボード</title>
    <style>
        body { font-family: "Segoe UI", Meiryo, sans-serif; margin: 20px; background-color: #f8f9fa; }
        h2 { border-left: 5px solid #2c3e50; padding-left: 10px; color: #333; }
        
        .table-container { overflow-x: auto; background: #fff; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: left; }
        th, td { border: 1px solid #d0d0d0; padding: 6px 10px; white-space: nowrap; }
        
        thead th { background-color: #e9ecef; text-align: center; font-weight: bold; }
        
        .col-code { text-align: left; font-family: monospace; width: 90px; }
        .col-name { width: 140px; }
        .col-num { text-align: right; width: 110px; }
        
        /* 配色設定 */
        tr.row-store-subtotal { background-color: #ffffcc; font-weight: bold; } /* 黄色 (小計) */
        tr.row-os-subtotal    { background-color: #cce5ff; font-weight: bold; } /* 水色 (OS小計) */
        tr.row-area-total     { background-color: #ffe5cc; font-weight: bold; } /* オレンジ (仙台/郡山小計) */
        tr.row-grand-total    { background-color: #f5c6cb; font-weight: bold; } /* ピンク (全社合計) */
    </style>
</head>
<body>

    <h2>実績集計ダッシュボード</h2>
    <div class="table-container">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>アカウントID</th>
                    <th>氏名 / 区分</th>
                    <th>目標</th>
                    <th>実績</th>
                    <th>達成率</th>
                    <th>前期実績</th>
                    <th>前期比</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align:center;">データを読み込み中...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // デプロイしたGASのウェブアプリURLを指定
        const webAppUrl = "https://script.google.com/macros/s/AKfycbz-lFZWwKF-lc21N40LyIiote6tZJyRcByfsGwAeMl0nAdg3T6yUKO3GainnMuoMOL_/exec";

        // 行構成テンプレート
        const structure = [
            { type: 'data', id: 'ecl00750', name: '安井 秀幸' },
            { type: 'data', id: 'ecl02695', name: '武藤 茉奈美' },
            { type: 'data', id: 'ecl03317', name: '伊藤 彩香' },
            { type: 'data', id: 'ecl04354', name: '文 赤井沢 2' },
            { type: 'data', id: 'ecl07853', name: '仙台文紙 2' },
            { type: 'subtotal', name: '店舗小計', targetKeys: ['安井 秀幸', '武藤 茉奈美', '伊藤 彩香', '文 赤井沢 2', '仙台文紙 2'], class: 'row-store-subtotal' },
            
            { type: 'data', id: 'ecl04350', name: '佐川 規人' },
            { type: 'data', id: 'ecl02088', name: '中川 雅之' },
            { type: 'data', id: 'ecl00747', name: '郡山 敏明' },
            { type: 'data', id: 'ecl04351', name: '黒澤 健' },
            { type: 'data', id: 'ecl04352', name: '相模 史信' },
            { type: 'data', id: 'ecl04621', name: '文 赤井沢' },
            { type: 'data', id: 'ecl07851', name: '仙台文紙' },
            { type: 'subtotal', name: '納品小計', targetKeys: ['佐川 規人', '中川 雅之', '郡山 敏明', '黒澤 健', '相模 史信', '文 赤井沢', '仙台文紙'], class: 'row-store-subtotal' },
            { type: 'subtotal', name: 'ＲＳ仙台小計', targetKeys: ['店舗小計', '納品小計'], class: 'row-store-subtotal' },
            
            { type: 'data', id: 'ecl02239', name: '浅野 勝寿' },
            { type: 'data', id: 'ecl02439', name: '内野 正太郎' },
            { type: 'data', id: 'ecl02777', name: '中島 祐太' },
            { type: 'data', id: 'ecl04622', name: '事 赤井沢' },
            { type: 'data', id: 'ecl07821', name: '仙台事務機' },
            { type: 'subtotal', name: 'ＯＳ仙台小計', targetKeys: ['浅野 勝寿', '内野 正太郎', '中島 祐太', '事 赤井沢', '仙台事務機'], class: 'row-os-subtotal' },
            
            { type: 'subtotal', name: '仙台小計', targetKeys: ['ＲＳ仙台小計', 'ＯＳ仙台小計'], class: 'row-area-total' }
        ];

        // JSONPのコールバック関数（GASからのデータを受け取る）
        function handleReportData(apiData) {
            try {
                const tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";

                const calculatedValues = {};

                structure.forEach(item => {
                    const tr = document.createElement("tr");
                    let target = 0, actual = 0, prevActual = 0;

                    if (item.type === 'data') {
                        const match = apiData[item.id] || { target: 0, actual: 0, prevActual: 0 };
                        target = match.target;
                        actual = match.actual;
                        prevActual = match.prevActual;

                        calculatedValues[item.name] = { target, actual, prevActual };

                        tr.innerHTML = `
                            <td class="col-code">${item.id}</td>
                            <td class="col-name">${item.name}</td>
                            <td class="col-num">${formatNum(target)}</td>
                            <td class="col-num">${formatNum(actual)}</td>
                            <td class="col-num">${calcRate(actual, target)}</td>
                            <td class="col-num">${formatNum(prevActual)}</td>
                            <td class="col-num">${calcRate(actual, prevActual)}</td>
                        `;
                    } 
                    else if (item.type === 'subtotal') {
                        tr.className = item.class;
                        
                        if (item.targetKeys && Array.isArray(item.targetKeys)) {
                            item.targetKeys.forEach(key => {
                                if (calculatedValues[key]) {
                                    target += calculatedValues[key].target;
                                    actual += calculatedValues[key].actual;
                                    prevActual += calculatedValues[key].prevActual;
                                }
                            });
                        }

                        calculatedValues[item.name] = { target, actual, prevActual };

                        tr.innerHTML = `
                            <td class="col-code"></td>
                            <td class="col-name"><b>${item.name}</b></td>
                            <td class="col-num">${formatNum(target)}</td>
                            <td class="col-num">${formatNum(actual)}</td>
                            <td class="col-num">${calcRate(actual, target)}</td>
                            <td class="col-num">${formatNum(prevActual)}</td>
                            <td class="col-num">${calcRate(actual, prevActual)}</td>
                        `;
                    }

                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("描画エラー:", error);
                showError();
            }
        }

        function showError() {
            document.getElementById("tableBody").innerHTML = 
                '<tr><td colspan="7" style="color:red; text-align:center;">データの取得・集計に失敗しました。</td></tr>';
        }

        function formatNum(val) {
            if (!val || isNaN(val)) return "-";
            return Number(val).toLocaleString();
        }

        function calcRate(actual, base) {
            if (!base || base === 0 || !actual) return "-";
            return ((actual / base) * 100).toFixed(2) + "%";
        }

        // ページ読み込み時にscriptタグを動的生成してデータ取得（JSONP）
        function loadReport() {
            const script = document.createElement('script');
            script.src = `${webAppUrl}?callback=handleReportData`;
            script.onerror = () => showError();
            document.body.appendChild(script);
        }

        loadReport();
    </script>
</body>
</html>
