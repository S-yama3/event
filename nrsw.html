<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV キー照合・最新タイムスタンプ結合</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-8 px-4">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">CSV キー照合ツール（最新タイムスタンプ付与）</h1>
            <p class="text-gray-600">CSV Aの全データに対し、CSV BのB列（KEY）を照合して最新のタイムスタンプ（A列）を結合します。</p>
        </header>

        <!-- コントロール・ステータスエリア -->
        <div class="bg-white shadow rounded-lg p-6 mb-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div id="status" class="text-lg font-medium text-blue-600">
                データを読み込み中...
            </div>
            <button onclick="loadAndMergeData()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-md shadow transition duration-200">
                データを再読み込み
            </button>
        </div>

        <!-- 結果表示テーブル -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table id="result-table" class="min-w-full divide-y divide-gray-200">
                    <thead id="table-head" class="bg-gray-100">
                        <!-- 動的に列ヘッダーが生成されます -->
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200 bg-white text-sm">
                        <!-- 動的にデータ行が生成されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CSVの公開URL設定
        const CSV_A_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNFzyOl7D4nIkGYJve2p4J22KnAhy8gxmYPnkUfLlhrkEe0uTfxZgMUg_yXZoVkL0T1m1Z-MH5KNM7/pub?gid=0&single=true&output=csv';
        const CSV_B_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqxmOav0KJySI86gMxypguZ-Rh6bDkIBs1DYO-L7isDWGB3I9MI_KyxMcE4FRFbsYyA_2kxuEAQAqg/pub?output=csv';

        // キー列の設定（0始まりのインデックス）
        // CSV A の KEY列 = H列 (A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7)
        const KEY_INDEX_A = 7;
        
        // CSV B の タイムスタンプ列 = A列 (0), KEY列 = B列 (1)
        const TIME_INDEX_B = 0;
        const KEY_INDEX_B = 1;

        // 簡易CSVパーサー
        function parseCSV(text) {
            let lines = text.split(/\r\n|\n/);
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') {
                        if (inQuotes && line[j + 1] === '"') {
                            currentVal += '"';
                            j++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal);
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal);
                result.push(row);
            }
            return result;
        }

        async function loadAndMergeData() {
            const statusEl = document.getElementById('status');
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');

            statusEl.textContent = 'CSVデータを取得中...';
            statusEl.className = 'text-lg font-medium text-blue-600';
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            try {
                const [resA, resB] = await Promise.all([
                    fetch(CSV_A_URL),
                    fetch(CSV_B_URL)
                ]);

                if (!resA.ok || !resB.ok) {
                    throw new Error('CSVの取得に失敗しました。');
                }

                const textA = await resA.text();
                const textB = await resB.text();

                const dataA = parseCSV(textA);
                const dataB = parseCSV(textB);

                if (dataA.length === 0) {
                    statusEl.textContent = 'CSV Aにデータが存在しません。';
                    statusEl.className = 'text-lg font-medium text-red-600';
                    return;
                }

                // 見出し行とデータ行の分離
                const headerA = dataA[0];
                const rowsA = dataA.slice(1);

                const rowsB = dataB.length > 1 ? dataB.slice(1) : dataB; // 見出しがある想定、なければ全体

                // 1. CSV Bをスキャンして、同じKEYの中で「最も新しい（最大）タイムスタンプ」を保持するマップを作成
                const latestTimeMap = new Map();
                rowsB.forEach(rowB => {
                    if (rowB.length > KEY_INDEX_B) {
                        const key = rowB[KEY_INDEX_B].trim();
                        const timeStr = (rowB.length > TIME_INDEX_B) ? rowB[TIME_INDEX_B].trim() : '';
                        if (key && timeStr) {
                            if (!latestTimeMap.has(key) || timeStr > latestTimeMap.get(key)) {
                                latestTimeMap.set(key, timeStr);
                            }
                        }
                    }
                });

                // 2. CSV Aを基準にデータを結合（最新タイムスタンプを追加）
                let mergedRows = [];
                rowsA.forEach(rowA => {
                    const keyA = (rowA.length > KEY_INDEX_A) ? rowA[KEY_INDEX_A].trim() : '';
                    const latestTime = keyA && latestTimeMap.has(keyA) ? latestTimeMap.get(keyA) : '';
                    
                    // Aの全列 + 最新タイムスタンプ
                    mergedRows.push([...rowA, latestTime]);
                });

                // 3. テーブルヘッダーの生成（CSV Aのヘッダー ＋ 追加列名）
                let headerHtml = '<tr>';
                headerA.forEach(th => {
                    headerHtml += `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-blue-50">${th}</th>`;
                });
                headerHtml += `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-green-50">最新タイムスタンプ</th>`;
                headerHtml += '</tr>';
                tableHead.innerHTML = headerHtml;

                // 4. テーブルボディの生成
                let bodyHtml = '';
                mergedRows.forEach(row => {
                    bodyHtml += '<tr class="hover:bg-gray-50">';
                    row.forEach((cell, index) => {
                        let cellValue = (cell !== undefined) ? cell : '';
                        cellValue = cellValue.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                        
                        // 最後のタイムスタンプ列だけ背景色を薄い緑にして目立たせる
                        if (index === row.length - 1) {
                            bodyHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-green-700 bg-green-50/50 border-b border-gray-200">${cellValue}</td>`;
                        } else {
                            bodyHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 border-b border-gray-200">${cellValue}</td>`;
                        }
                    });
                    bodyHtml += '</tr>';
                });
                tableBody.innerHTML = bodyHtml;

                statusEl.textContent = `照合完了: 基準データ ${rowsA.length} 件処理完了（最新タイムスタンプを付与しました）`;
                statusEl.className = 'text-lg font-medium text-green-600';

            } catch (error) {
                console.error(error);
                statusEl.textContent = `エラーが発生しました: ${error.message}`;
                statusEl.className = 'text-lg font-medium text-red-600';
            }
        }

        // ページ読み込み時に実行
        window.addEventListener('DOMContentLoaded', loadAndMergeData);
    </script>
</body>
</html>
