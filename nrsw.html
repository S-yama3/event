<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入場管理・最新タイムスタンプ結合</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-8 px-4">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">入場管理データ照合ツール</h1>
            <p class="text-gray-600">CSV Aの B・C・D・E列 と、CSV Bの最新「入場時間」をKEY照合して表示します。</p>
        </header>

        <!-- コントロール・ステータスエリア -->
        <div class="bg-white shadow rounded-lg p-6 mb-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div id="status" class="text-lg font-medium text-blue-600">
                データを読み込み中...
            </div>
            <button onclick="loadAndMergeData()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-md shadow transition duration-200">
                データを再読み込み
            </button>
        </div>

        <!-- 結果表示テーブル -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table id="result-table" class="min-w-full divide-y divide-gray-200">
                    <thead id="table-head" class="bg-gray-100">
                        <!-- 動的に列ヘッダーが生成されます -->
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200 bg-white text-sm">
                        <!-- 動的にデータ行が生成されます -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CSVの公開URL設定
        const CSV_A_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTNFzyOl7D4nIkGYJve2p4J22KnAhy8gxmYPnkUfLlhrkEe0uTfxZgMUg_yXZoVkL0T1m1Z-MH5KNM7/pub?gid=0&single=true&output=csv';
        const CSV_B_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqxmOav0KJySI86gMxypguZ-Rh6bDkIBs1DYO-L7isDWGB3I9MI_KyxMcE4FRFbsYyA_2kxuEAQAqg/pub?output=csv';

        // キー列の設定（0始まりのインデックス）
        // CSV A の KEY列 = H列 (7)
        const KEY_INDEX_A = 7;
        
        // CSV B の 入場時間列(タイムスタンプ) = A列 (0)、KEY列 = B列 (1)
        const TIME_INDEX_B = 0;
        const KEY_INDEX_B = 1;

        // 表示したいCSV Aの列インデックス（B=1, C=2, D=3, E=4）
        const TARGET_COLUMNS_A = [1, 2, 3, 4];

        // 簡易CSVパーサー
        function parseCSV(text) {
            let lines = text.split(/\r\n|\n/);
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') {
                        if (inQuotes && line[j + 1] === '"') {
                            currentVal += '"';
                            j++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal);
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal);
                result.push(row);
            }
            return result;
        }

        async function loadAndMergeData() {
            const statusEl = document.getElementById('status');
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');

            statusEl.textContent = 'CSVデータを取得中...';
            statusEl.className = 'text-lg font-medium text-blue-600';
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            try {
                const [resA, resB] = await Promise.all([
                    fetch(CSV_A_URL),
                    fetch(CSV_B_URL)
                ]);

                if (!resA.ok || !resB.ok) {
                    throw new Error('CSVの取得に失敗しました。');
                }

                const textA = await resA.text();
                const textB = await resB.text();

                const dataA = parseCSV(textA);
                const dataB = parseCSV(textB);

                if (dataA.length === 0) {
                    statusEl.textContent = 'CSV Aにデータが存在しません。';
                    statusEl.className = 'text-lg font-medium text-red-600';
                    return;
                }

                const headerA = dataA[0];
                const rowsA = dataA.slice(1);
                const rowsB = dataB.length > 1 ? dataB.slice(1) : dataB;

                // 1. CSV Bから同じKEYの中で最も新しい「入場時間」をマップ化
                const latestTimeMap = new Map();
                rowsB.forEach(rowB => {
                    if (rowB.length > KEY_INDEX_B) {
                        const key = rowB[KEY_INDEX_B].trim();
                        const timeStr = (rowB.length > TIME_INDEX_B) ? rowB[TIME_INDEX_B].trim() : '';
                        if (key && timeStr) {
                            if (!latestTimeMap.has(key) || timeStr > latestTimeMap.get(key)) {
                                latestTimeMap.set(key, timeStr);
                            }
                        }
                    }
                });

                // 2. テーブルヘッダーの生成（指定されたB, C, D, E列 ＋ 入場時間）
                let headerHtml = '<tr>';
                TARGET_COLUMNS_A.forEach(colIdx => {
                    let thName = (headerA.length > colIdx) ? headerA[colIdx] : `列 ${colIdx + 1}`;
                    headerHtml += `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-blue-50">${thName}</th>`;
                });
                headerHtml += `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-green-50">入場時間</th>`;
                headerHtml += '</tr>';
                tableHead.innerHTML = headerHtml;

                // 3. 各行のデータを抽出して構築
                let bodyHtml = '';
                let processedCount = 0;

                rowsA.forEach(rowA => {
                    const keyA = (rowA.length > KEY_INDEX_A) ? rowA[KEY_INDEX_A].trim() : '';
                    const latestTime = keyA && latestTimeMap.has(keyA) ? latestTimeMap.get(keyA) : '';

                    bodyHtml += '<tr class="hover:bg-gray-50">';
                    
                    // B, C, D, E列の値を出力
                    TARGET_COLUMNS_A.forEach(colIdx => {
                        let cellValue = (rowA.length > colIdx && rowA[colIdx] !== undefined) ? rowA[colIdx] : '';
                        cellValue = cellValue.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                        bodyHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 border-b border-gray-200">${cellValue}</td>`;
                    });

                    // 最後に最新の入場時間を出力（緑色の強調表示）
                    let timeVal = latestTime.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                    bodyHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-green-700 bg-green-50/50 border-b border-gray-200">${timeVal}</td>`;
                    
                    bodyHtml += '</tr>';
                    processedCount++;
                });

                tableBody.innerHTML = bodyHtml;
                statusEl.textContent = `照合完了: 全 ${processedCount} 件を表示中（B, C, D, E列 ＋ 入場時間）`;
                statusEl.className = 'text-lg font-medium text-green-600';

            } catch (error) {
                console.error(error);
                statusEl.textContent = `エラーが発生しました: ${error.message}`;
                statusEl.className = 'text-lg font-medium text-red-600';
            }
        }

        // ページ読み込み時に実行
        window.addEventListener('DOMContentLoaded', loadAndMergeData);
    </script>
</body>
</html>
